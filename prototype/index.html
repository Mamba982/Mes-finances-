<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes finances et projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Outil de travail : en-tête fixe à 3 chiffres, onglets, cartes sobres ; vert-bleu profond pour l'action, couleurs sémantiques à part */
:root{
  --bg:#f3f5f4;--surface:#ffffff;--ink:#16201c;--mute:#5a6964;--line:#dce3e0;--accent:#0e6b5c;--accent-ink:#ffffff;--soft:#e9eeec;
  --ok:#2c7a4b;--warn:#9c5d00;--bad:#b3261e;--court:#c2611d;--moyen:#1f5f8b;--long:#5b4a9e;
  --display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--surface:#171f1c;--ink:#e7eeeb;--mute:#93a39d;--line:#29342f;--accent:#4dbfa7;--accent-ink:#06231d;--soft:#202a26;
  --ok:#5cc28a;--warn:#e0a24a;--bad:#ef7b72;--court:#e68a4a;--moyen:#6aa8d6;--long:#a796e6;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1513;--surface:#171f1c;--ink:#e7eeeb;--mute:#93a39d;--line:#29342f;--accent:#4dbfa7;--accent-ink:#06231d;--soft:#202a26;
  --ok:#5cc28a;--warn:#e0a24a;--bad:#ef7b72;--court:#e68a4a;--moyen:#6aa8d6;--long:#a796e6;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--body)}
#app{max-width:980px;margin:0 auto;padding:0 16px 80px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:26px 0 10px}
h3{font-size:18px;font-weight:700;margin-bottom:12px}
.num,.kv b,td.n,.big{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.warn{color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs a{padding:9px 12px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:460px){.g2,.g4{grid-template-columns:1fr}}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--mute);margin-top:2px}
.kpi.stripe{border-left:4px solid var(--line)}
.kpi.stripe.ok{border-left-color:var(--ok)}.kpi.stripe.warn{border-left-color:var(--warn)}.kpi.stripe.bad{border-left-color:var(--bad)}
.neg{color:var(--bad)}.pos{color:var(--ok)}.wrn{color:var(--warn)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;font-size:15px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.dan{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.todo{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.todo li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.todo .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.todo .dot.bad{background:var(--bad)}.todo .dot.warn{background:var(--warn)}.todo .dot.ok{background:var(--ok)}
.todo .txt{flex:1}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;vertical-align:middle}
.tag.court{background:var(--court)}.tag.moyen{background:var(--moyen)}.tag.long{background:var(--long)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.st{font-size:13px;font-weight:700;white-space:nowrap}
.st.ok,.st.atteint{color:var(--ok)}.st.retard{color:var(--warn)}.st.nonfinance,.st.depasse{color:var(--bad)}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pn{font-weight:700;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 14px;margin-top:10px;font-size:14px}
.kv span{color:var(--mute);display:block}
.kv b{font-weight:600}
.note{font-size:14px;color:var(--mute)}
.alert{background:var(--soft);border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px}
.alert.info{border-left-color:var(--accent)}
.alert.bad{border-left-color:var(--bad)}
.demo{background:var(--surface);border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
td select{padding:4px 6px;font-size:13px;max-width:170px}
.mrow{display:flex;align-items:center;gap:8px}
.mrow b{font-family:var(--display);font-size:17px;min-width:150px;text-align:center}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
label{font-size:13px;color:var(--mute)}
input,select,textarea{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:110px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:460px){.row3{grid-template-columns:1fr 1fr}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px 16px 26px;max-height:92vh;overflow:auto}
@media(min-width:680px){.ov{align-items:center}.sheet{border-radius:16px}}
.empty{text-align:center;padding:22px 14px;color:var(--mute)}
.chat{display:grid;gap:10px;margin-top:10px}
.msg{padding:10px 12px;border-radius:10px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.u{background:var(--accent);color:var(--accent-ink);justify-self:end}
.msg.a{background:var(--surface);border:1px solid var(--line)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;font-size:14px}
.badge{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft)}
.badge.bad{color:var(--bad)}.badge.warn{color:var(--warn)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.sec-h h2{margin:0}
.muted{color:var(--mute)}
.small{font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ---------- utilitaires ---------- */
var root=document.getElementById('app');
var LSK='mes-finances-projets-v2';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;var s=String(v==null?'':v).replace(/[\s $]/g,'');var neg=/^\(.*\)$/.test(s)||/-$/.test(s);s=s.replace(/[()]/g,'').replace(/-$/,'');if(/,\d{1,2}$/.test(s)&&s.indexOf('.')>-1&&s.lastIndexOf('.')<s.lastIndexOf(','))s=s.replace(/\./g,'');if(/,\d{1,2}$/.test(s))s=s.replace(',','.');s=s.replace(/,/g,'');var n=parseFloat(s);if(!isFinite(n))return 0;return neg?-Math.abs(n):n;}
function r2(n){return Math.round(n*100)/100;}
function dev(){return (S&&S.reglages&&S.reglages.devise)||'CAD';}
function money(n,d){d=d==null?0:d;try{return new Intl.NumberFormat('fr-CA',{style:'currency',currency:dev(),minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);}catch(e){return (n||0).toFixed(d)+' $';}}
function m2(n){return money(n,2);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function parseD(s){if(!s)return null;var p=String(s).split('-');if(p.length<3)return null;var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?null:d;}
function ymNow(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function ymAdd(ym,k){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function ymLabel(ym){var p=ym.split('-');var s=new Date(+p[0],+p[1]-1,1).toLocaleDateString('fr-CA',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}
function ymShort(ym){var p=ym.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('fr-CA',{month:'short'}).replace('.','');}
function dLabel(s){var d=parseD(s);return d?d.toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'}):'';}
function dShort(s){var d=parseD(s);return d?d.toLocaleDateString('fr-CA',{day:'numeric',month:'short'}):'';}
function addDays(s,k){var d=parseD(s)||new Date();d.setDate(d.getDate()+k);return iso(d);}
function daysBetween(a,b){var x=parseD(a),y=parseD(b);if(!x||!y)return 0;return Math.round((y-x)/86400000);}
function addMonthsIso(k){var d=new Date();d.setMonth(d.getMonth()+k);return iso(d);}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- catégories et règles ---------- */
var CATS_DEF=[
 {id:'salaire',nom:'Salaire et prestations',type:'revenu',budget:0},
 {id:'rev-entreprise',nom:'Revenus d\'entreprise',type:'revenu',budget:0},
 {id:'autres-revenus',nom:'Autres revenus',type:'revenu',budget:0},
 {id:'logement',nom:'Logement (loyer, Hydro)',type:'depense',budget:1150},
 {id:'epicerie',nom:'Épicerie',type:'depense',budget:380},
 {id:'restaurants',nom:'Restaurants',type:'depense',budget:90},
 {id:'transport',nom:'Transport',type:'depense',budget:110},
 {id:'telecom',nom:'Cellulaire et Internet',type:'depense',budget:95},
 {id:'abonnements',nom:'Abonnements',type:'depense',budget:35},
 {id:'sante',nom:'Santé et pharmacie',type:'depense',budget:40},
 {id:'achats',nom:'Achats',type:'depense',budget:100},
 {id:'loisirs',nom:'Loisirs',type:'depense',budget:60},
 {id:'education',nom:'Éducation',type:'depense',budget:0},
 {id:'famille',nom:'Envois à la famille',type:'depense',budget:150},
 {id:'frais',nom:'Frais bancaires',type:'depense',budget:0},
 {id:'affaires',nom:'Dépenses d\'entreprise',type:'depense',budget:0},
 {id:'autres',nom:'Autres dépenses',type:'depense',budget:50},
 {id:'epargne',nom:'Épargne et projets',type:'epargne',budget:0}
];
var RULES=[
 [/salaire|paie\b|payroll|d[ée]p[oô]t direct|direct dep|assurance[- ]emploi|\bae\b|prestation|allocation|cr[ée]dit (tps|solidarit)|\barc\b|\bcra\b|revenu qu[ée]bec/i,'salaire',1],
 [/loyer|rent\b|hydro[- ]?qu[ée]bec|[ée]nergir|assurance habitation/i,'logement'],
 [/\biga\b|metro\b|maxi\b|provigo|super ?c\b|walmart|costco|loblaw|sobeys|adonis|march[ée]|[ée]picerie|grocery|avril\b|mayrand/i,'epicerie'],
 [/restaurant|tim ?hortons|mcdonald|starbucks|subway|a&w|uber ?eats|doordash|skip ?the|pizza|caf[ée]\b|bistro/i,'restaurants'],
 [/\bstm\b|\brtc\b|opus|\bexo\b|uber(?! ?eats)|lyft|esso|shell|petro|ultramar|couche[- ]tard|communauto|bixi|saaq|stationnement|parking|via rail|orl[ée]ans/i,'transport'],
 [/vid[ée]otron|\bbell\b|rogers|fido|koodo|virgin|telus|freedom|fizz|public mobile|cogeco/i,'telecom'],
 [/netflix|spotify|disney|prime video|amazon prime|apple\.com|icloud|youtube|crave|adobe|openai|anthropic|claude\.ai|chatgpt|microsoft 365|xbox|playstation/i,'abonnements'],
 [/pharmaprix|jean coutu|uniprix|familiprix|brunet|pharmacie|dentist|clinique|optom/i,'sante'],
 [/universit|c[ée]gep|scolarit|tuition|coursera|udemy/i,'education'],
 [/frais|\bfee|service charge|int[ée]r[êe]ts?|interest|\bnsf\b|provision insuffisante|conversion|taux de change|overdraft|d[ée]couvert/i,'frais'],
 [/western union|remitly|moneygram|\bwise\b|taptap|sendwave|worldremit/i,'famille'],
 [/amazon|dollarama|canadian tire|ikea|best ?buy|winners|simons|sport ?expert|bureau en gros|staples|aliexpress|temu|shein/i,'achats'],
 [/cin[ée]ma|cineplex|spectacle|billet|ticketmaster|gym|[ée]nergie cardio|ymca/i,'loisirs'],
 [/[ée]pargne|savings|celi|tfsa|reer|rrsp|wealthsimple|questrade|placement/i,'epargne']
];
var FEE_RE=/frais|\bfees?\b|service charge|int[ée]r[êe]ts?|interest|\bnsf\b|provision insuffisante|conversion|taux de change|\bfx\b|cotisation annuelle|annual fee|overdraft|d[ée]couvert|p[ée]nalit/i;
function normMarchand(l){var s=String(l||'').replace(/\b(achat|paiement|pmt|pos|pre-?auth|pr[ée]autoris[ée]|interac|tpv|carte|card|purchase|debit|d[ée]bit|visa|mc|mastercard|retrait|withdrawal|op[ée]ration|transaction)\b/ig,' ').replace(/[#*]\S*/g,' ').replace(/\b\d[\d\-\/.:]*\b/g,' ').replace(/\s+/g,' ').trim();var w=s.split(' ').slice(0,3).join(' ');if(!w)w=String(l||'').slice(0,24);return w.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});}
function autoCat(lib,mt){for(var i=0;i<RULES.length;i++){var r=RULES[i];if(r[0].test(lib)){if(r[2]&&mt<0)continue;if(r[1]==='salaire'&&mt<0)continue;if(r[1]!=='salaire'&&r[1]!=='epargne'&&mt>0)continue;return r[1];}}
  if(mt>0){if(/virement|e-?transfer|interac|transfert/i.test(lib))return 'autres-revenus';return 'autres-revenus';}
  return null;}
function cat(id){return (S.categories||[]).find(function(c){return c.id===id;});}
function catType(t){var c=cat(t.categorie);if(c)return c.type;return t.montant>=0?'revenu':'depense';}
function catNom(id){var c=cat(id);return c?c.nom:'À classer';}

/* ---------- état ---------- */
var S=null,T=[],DEMO=false,MODE='init',STATUS='Connexion…';
function emptyState(){return {v:2,reglages:{devise:'CAD',capaciteMode:'auto',capaciteManuelle:0,fraisCartePct:2.9,fraisCarteFixe:0.25,fraisInterac:0,fraisChangePct:1.5,abonnementUSD:10,tps:5,tvq:9.975,entreprise:'',adresse:'',noTPS:'',noTVQ:''},categories:clone(CATS_DEF),projets:[],factures:[],comptes:[]};}
function normalize(o){var e=emptyState();o=o||{};var s={v:2,reglages:Object.assign(e.reglages,o.reglages||{}),categories:Array.isArray(o.categories)&&o.categories.length?o.categories:e.categories,projets:Array.isArray(o.projets)?o.projets:[],factures:Array.isArray(o.factures)?o.factures:[],comptes:Array.isArray(o.comptes)?o.comptes:[]};
  if(o.reglages&&o.reglages.capacite!=null&&o.v!==2){s.reglages.capaciteManuelle=num(o.reglages.capacite);s.reglages.capaciteMode='manuel';}
  s.projets.forEach(function(p){p.mouvements=p.mouvements||[];p.postes=p.postes||[];if(!p.id)p.id=uid();});
  return s;}

function demoState(){

  s.projets=[
   {id:'p1',nom:'Fonds d\'urgence',cout:5000,initial:1200,echeance:addMonthsIso(10),priorite:1,notes:'Trois mois de dépenses de base.',mouvements:[{id:'m1',montant:300,date:iso(new Date(now.getFullYear(),now.getMonth()-1,3)),note:'Virement mensuel'}],postes:[]},

   {id:'p3',nom:'Ordinateur portable',cout:1600,initial:0,echeance:addMonthsIso(6),priorite:3,notes:'',mouvements:[],postes:[]}
  ];
  s.reglages.entreprise='Mon entreprise (exemple)';
  s.factures=[
   {id:'f1',no:'F-'+now.getFullYear()+'-001',client:'Restaurant Le Baobab',courriel:'',description:'Service de traiteur, 40 personnes',montant:750,taxes:true,date:addDays(today(),-45),echeance:addDays(today(),-15),statut:'payee',payeeLe:addDays(today(),-20)},
   {id:'f2',no:'F-'+now.getFullYear()+'-002',client:'Événements Kasaï',courriel:'',description:'Décoration de salle',montant:1200,taxes:true,date:addDays(today(),-40),echeance:addDays(today(),-10),statut:'envoyee'},
   {id:'f3',no:'F-'+now.getFullYear()+'-003',client:'Association des parents',courriel:'',description:'Animation, fête de fin d\'année',montant:480,taxes:true,date:today(),echeance:addDays(today(),30),statut:'brouillon'}
  ];

  });

function splitCSV(line,d){var out=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===d){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out.map(function(s){return s.trim();});}
function isDateStr(s){return /^\s*(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}|\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})\s*$/.test(s)||/^\d{8}$/.test(s);}
function isNumStr(s){return /^\s*[-(]?\s*\$?\s*-?[\d\s ]+([.,]\d{1,2})?\s*\$?\s*\)?-?\s*$/.test(s)&&/\d/.test(s);}

function parseCSV(text){
  var lines=String(text).replace(/\r/g,'').split('\n').filter(function(l){return l.trim();});if(lines.length<1)return [];
  var sample=lines.slice(0,10).join('\n');var d=[',',';','\t'].map(function(c){return [c,(sample.split(c).length)];}).sort(function(a,b){return b[1]-a[1];})[0][0];
  var rows=lines.map(function(l){return splitCSV(l,d);});
  var h=rows[0].map(function(x){return x.toLowerCase();});var hasHeader=!h.some(isDateStr)&&h.some(function(x){return /date|description|libell|montant|amount|d[ée]bit|cr[ée]dit|transaction/.test(x);});
  var body=hasHeader?rows.slice(1):rows;if(!body.length)return [];
  var idx={date:-1,desc:-1,mt:-1,deb:-1,cre:-1};
  if(hasHeader){h.forEach(function(x,i){if(idx.date<0&&/date/.test(x))idx.date=i;else if(idx.desc<0&&/descr|libell|d[ée]tail|marchand|merchant|payee|b[ée]n[ée]ficiaire|nom|name|memo/.test(x))idx.desc=i;else if(idx.deb<0&&/d[ée]bit|retrait|withdraw|sortie|paid out/.test(x))idx.deb=i;else if(idx.cre<0&&/cr[ée]dit|d[ée]p[oô]t|deposit|entr[ée]e|paid in/.test(x))idx.cre=i;else if(idx.mt<0&&/montant|amount|valeur|cad\$/.test(x))idx.mt=i;});}
  var ncol=Math.max.apply(null,body.map(function(r){return r.length;}));
  if(idx.date<0){for(var c=0;c<ncol;c++){if(body.filter(function(r){return isDateStr(r[c]||'');}).length>=body.length*0.6){idx.date=c;break;}}}
  if(idx.desc<0){var best=-1,bl=0;for(var c2=0;c2<ncol;c2++){if(c2===idx.date)continue;var L=body.reduce(function(a,r){var v=r[c2]||'';return a+(isNumStr(v)||isDateStr(v)?0:v.length);},0);if(L>bl){bl=L;best=c2;}}idx.desc=best;}
  if(idx.mt<0&&idx.deb<0){var numc=[];for(var c3=0;c3<ncol;c3++){if(c3===idx.date||c3===idx.desc)continue;var cnt=body.filter(function(r){return isNumStr(r[c3]||'');}).length;if(cnt>0)numc.push(c3);}
    var pair=null;for(var i1=0;i1<numc.length&&!pair;i1++)for(var j1=i1+1;j1<numc.length;j1++){var A=numc[i1],B2=numc[j1];var both=body.some(function(r){return isNumStr(r[A]||'')&&isNumStr(r[B2]||'');});var cov=body.filter(function(r){return isNumStr(r[A]||'')||isNumStr(r[B2]||'');}).length;if(!both&&cov>=body.length*0.8){pair=[A,B2];break;}}

  var pd=parseDateCols(body.map(function(r){return r[idx.date]||'';}));
  var out=[];body.forEach(function(r){var dt=pd(r[idx.date]||'');if(!dt)return;var mt;if(idx.mt>=0)mt=num(r[idx.mt]);else{var a=num(r[idx.deb]||0),b=num(r[idx.cre]||0);mt=Math.abs(b)-Math.abs(a);}if(!mt)return;var lib=(idx.desc>=0?r[idx.desc]:'')||'Transaction';out.push({date:dt,libelle:lib,montant:r2(mt)});});
  return out;
}

/* ---------- import : doublons ---------- */
function toks(s){return String(s||'').toLowerCase().replace(/[^a-zà-ÿ0-9 ]/g,' ').split(/\s+/).filter(function(w){return w.length>2&&!/^\d+$/.test(w);});}
function simil(a,b){var A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;var s={},inter=0;A.forEach(function(w){s[w]=1;});var u=Object.assign({},s);B.forEach(function(w){if(s[w]){inter++;s[w]=0;}u[w]=1;});return inter/Object.keys(u).length;}
function cle(t){return t.date+'|'+r2(num(t.montant)).toFixed(2)+'|'+toks(t.libelle).join(' ');}
function marquerDoublons(rows,base){
  var keys={};base.forEach(function(t){keys[cle(t)]=1;});var seen={};
  rows.forEach(function(r){var k=cle(r);r.dup=null;
    if(keys[k]||seen[k]){r.dup='exact';}
    else{var m=base.find(function(t){return Math.abs(num(t.montant)-r.montant)<0.01&&Math.abs(daysBetween(t.date,r.date))<=3&&(simil(t.libelle,r.libelle)>=0.4||normMarchand(t.libelle)===normMarchand(r.libelle));});if(m)r.dup='probable';}

}

async function aiJSON(prompt,opts){return AI.json(prompt,opts||{});}
async function aiTransactions(text,images){
  var an=new Date().getFullYear();
  var p='Tu extrais les transactions d\'un relevé bancaire ou de carte de crédit canadien.\nRéponds UNIQUEMENT avec un objet JSON de la forme {"transactions":[{"date":"AAAA-MM-JJ","libelle":"texte tel qu\'écrit","montant":nombre}]}.\nRègles : montant négatif pour une dépense, un achat, un retrait ou un débit ; positif pour un dépôt, un crédit ou un paiement reçu. Sur un relevé de carte de crédit, un achat est négatif et un paiement de la carte est positif. Ignore les soldes, totaux, sous-totaux, en-têtes et pieds de page. Si l\'année n\'apparaît pas, utilise '+an+' (ou '+(an-1)+' si le mois est postérieur au mois courant, '+ymNow()+'). N\'invente aucune transaction.\n';
  var res=images?await aiJSON(p+'Le relevé est dans l\'image jointe.',{images:images}):await aiJSON(p+'Texte du relevé :\n<<<\n'+String(text).slice(0,60000)+'\n>>>');
  var l=(res&&res.transactions)||(Array.isArray(res)?res:[]);
  return l.map(function(x){return {date:String(x.date||'').slice(0,10),libelle:String(x.libelle||x.description||'Transaction'),montant:r2(num(x.montant))};}).filter(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.montant;});
}
async function aiCategoriser(items){

async function aiRecu(img){

/* ---------- PDF ---------- */
function loadScript(u){return new Promise(function(ok,ko){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s);});}
async function pdfText(file){
  var base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib)await loadScript(base+'pdf.min.js');
  if(!window.pdfjsWorker)await loadScript(base+'pdf.worker.min.js').catch(function(){});
  var lib=window.pdfjsLib;if(!lib)throw new Error('Le lecteur PDF n\'a pas pu se charger. Exporte un CSV ou fais une capture d\'écran.');
  try{lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
  var buf=await file.arrayBuffer();var pdf=await lib.getDocument({data:buf,isEvalSupported:false}).promise;var out=[];
  for(var i=1;i<=Math.min(pdf.numPages,30);i++){var pg=await pdf.getPage(i);var tc=await pg.getTextContent();var lines={};tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push([it.transform[4],it.str]);});Object.keys(lines).sort(function(a,b){return b-a;}).forEach(function(y){out.push(lines[y].sort(function(a,b){return a[0]-b[0];}).map(function(x){return x[1];}).join(' '));});out.push('');}
  return out.join('\n');
}

/* ---------- graphiques ---------- */
function lineChart(series,labels,opt){
  opt=opt||{};var W=640,H=220,L=64,R=30,Tp=12,B=28;var all=[];series.forEach(function(s){all=all.concat(s.pts);});var mx=Math.max.apply(null,all.concat([1]));var mn=Math.min(0,Math.min.apply(null,all));
  var step=Math.pow(10,Math.floor(Math.log10((mx-mn)||1)));var top=Math.ceil(mx/step)*step;if(top/step>8){step*=2;top=Math.ceil(mx/step)*step;}mn=Math.floor(mn/step)*step;
  var n=Math.max.apply(null,series.map(function(s){return s.pts.length;}));function X(i){return L+(n<=1?0:i*(W-L-R)/(n-1));}function Y(v){return Tp+(H-Tp-B)*(1-(v-mn)/((top-mn)||1));}
  var g='';for(var v=mn;v<=top+1e-9;v+=step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+esc(money(v))+'</text>';}
  var lab='';var every=Math.ceil(n/8);labels.forEach(function(t,i){if(i%every===0||i===n-1)lab+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(t)+'</text>';});
  var paths='';series.forEach(function(s,si){var d=s.pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1);}).join(' ');
    if(si===0&&opt.fill)paths+='<path d="'+d+' L'+X(s.pts.length-1)+' '+Y(mn)+' L'+X(0)+' '+Y(mn)+' Z" fill="'+s.color+'" opacity=".12"/>';
    paths+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
    var li=s.pts.length-1;paths+='<circle cx="'+X(li)+'" cy="'+Y(s.pts[li])+'" r="4" fill="'+s.color+'"/>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||'Graphique')+'">'+g+lab+paths+'</svg>';
}

async function lireFichier(file){
  var M=UI.modal;if(!M)return;var name=(file.name||'').toLowerCase(),type=file.type||'';
  try{
    var rows=[];
    if(/\.(csv|txt)$/.test(name)||/csv|text\/plain/.test(type)){var text=await file.text();rows=parseCSV(text);M.src='CSV';if(!rows.length&&aiReady()){M.busy='Lecture du relevé par l\'IA…';render();rows=await aiTransactions(text);M.src='texte lu par l\'IA';}}
    else if(/\.pdf$/.test(name)||/pdf/.test(type)){if(!aiReady())throw new Error('Il faut l\'IA pour lire un PDF. Exporte plutôt un CSV depuis ta banque.');M.busy='Extraction du texte du PDF…';render();var tx=await pdfText(file);if(tx.replace(/\s/g,'').length<40)throw new Error('Ce PDF ne contient pas de texte (document numérisé). Fais une capture d\'écran à la place.');M.busy='Lecture des transactions par l\'IA…';render();rows=await aiTransactions(tx);M.src='PDF lu par l\'IA';}
    else if(/^image\//.test(type)){if(!aiReady()||!AIimg)throw new Error('La lecture d\'images n\'est pas disponible ici. Utilise un CSV.');M.busy='Lecture de la capture par l\'IA…';render();rows=await aiTransactions(null,[file]);M.src='image lue par l\'IA';}
    else throw new Error('Format non reconnu. Utilise un CSV, un PDF ou une image.');
    M.busy=null;if(!rows.length){UI.msg='Aucune transaction trouvée dans ce fichier.';render();return;}
    rows.forEach(function(r){r.categorie=autoCat(r.libelle,r.montant);});marquerDoublons(rows,T);M.rows=rows;M.step='review';UI.msg='';render();
  }catch(e){M.busy=null;UI.msg=(e&&e.code)?aiErr(e):((e&&e.message)||'Lecture impossible.');render();}
}

  else if(k==='budgets'){S.categories.forEach(function(c){if(f.elements['n-'+c.id])c.nom=g('n-'+c.id)||c.nom;if(f.elements['b-'+c.id])c.budget=num(g('b-'+c.id));});var nn=g('nc-nom');if(nn)S.categories.splice(S.categories.length-1,0,{id:'c-'+uid(),nom:nn,type:g('nc-type')||'depense',budget:0});UI.modal=null;commit();}
  else if(k==='reglages'){var R=S.reglages;R.capaciteMode=g('capaciteMode');['capaciteManuelle','fraisCartePct','fraisCarteFixe','fraisInterac','tps','tvq','abonnementUSD'].forEach(function(n){R[n]=num(g(n));});['devise','entreprise','adresse','noTPS','noTVQ'].forEach(function(n){R[n]=g(n);});UI.modal=null;commit();}
  else if(k==='restore'){try{var o=JSON.parse(g('txt'));var old=moisAvecDonnees();if(o&&o.S){S=normalize(o.S);T=Array.isArray(o.T)?o.T:[];}else if(o&&Array.isArray(o.projets)){S=normalize(o);T=[];}else throw 0;DEMO=false;UI.modal=null;UI.msg='';commit(old.concat(moisAvecDonnees()));}catch(err){UI.msg='Ce texte n\'est pas une sauvegarde valide.';render();}}
  else if(k==='chat'){var q=g('q');if(q)poser(q);}
});

boot();
